name: Upload media

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  upload:
    if: ${{ github.repository == 'alextheman231/media' }}
    runs-on: macos-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Setup PDM
        run: pip install pdm

      - name: Install Python dependencies
        run: pdm install --frozen-lockfile

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Clear the existing media folder
        run: rm -rf dist

      - name: Generate the media files
        run: pdm run generate

      - name: Remove cached files from media output
        run: find dist -type d -name partial_movie_files -exec rm -rf {} +

      - name: Shorten commit hash for use in media output name
        id: short_hash
        run: echo "short_hash=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload the media files to the workflow output
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist
          name: media-output_${{ steps.short_hash.outputs.short_hash }}
