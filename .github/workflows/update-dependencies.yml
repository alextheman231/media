name: Update Dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: 0 9 * * 1

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    if: ${{ github.repository == 'alextheman231/media' }}
    uses: alextheman231/github-actions/.github/workflows/update-dependencies.yml@6b4505c7a34faeadabb9c0078f595ed786bc4b0d # v14.7.0
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      runs-on: "macos-latest"
      update_pnpm: true
      update_javascript_dependencies: true
      update_actions: true
      update_python_dependencies: true
      body-path: .github/pull_request_template.md
